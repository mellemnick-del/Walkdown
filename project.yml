# Generate the Xcode project with: xcodegen generate
name: Reassured
options:
  bundleIdPrefix: com.nickmellem
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Nick Mellem's Apple Developer team, so signing works without picking a team in Xcode.
    DEVELOPMENT_TEAM: LK5983778F
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Reassured:
    type: application
    platform: iOS
    sources:
      - Reassured
      - Shared
    dependencies:
      - target: ReassuredWidgets
    info:
      path: Reassured/Info.plist
      properties:
        # Always follow the project's version and build number, so the app and widget match.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchArt
    entitlements:
      path: Reassured/Reassured.entitlements
      properties:
        # Files are encrypted and unreadable while the device is locked.
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        # Shared with the widgets so they can show the score and next tasks.
        com.apple.security.application-groups:
          - group.com.nickmellem.reassured
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickmellem.reassured
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reassured
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Reassured uses the camera to capture audit evidence and scan documents."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Reassured uses Face ID to keep your audit data locked."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ReassuredWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ReassuredWidgets
      - Shared
    info:
      path: ReassuredWidgets/Info.plist
      properties:
        CFBundleDisplayName: Reassured
        # Must match the app's version and build number, or App Store Connect rejects the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ReassuredWidgets/ReassuredWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nickmellem.reassured
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickmellem.reassured.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  ReassuredTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ReassuredTests
    dependencies:
      - target: Reassured
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.nickmellem.reassured.tests

schemes:
  Reassured:
    build:
      targets:
        Reassured: all
        ReassuredTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReassuredTests
    archive:
      config: Release
