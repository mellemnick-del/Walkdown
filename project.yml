# Generate the Xcode project with: xcodegen generate
name: Reassured
options:
  bundleIdPrefix: com.nickmellem
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Reassured:
    type: application
    platform: iOS
    sources:
      - Reassured
    entitlements:
      path: Reassured/Reassured.entitlements
      properties:
        # Files are encrypted and unreadable while the device is locked.
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickmellem.reassured
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reassured
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Reassured uses the camera to capture audit evidence and scan documents."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Reassured uses Face ID to keep your audit data locked."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
