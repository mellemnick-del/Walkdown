<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- F1. Held, refined: the dot rests in a deeper, cupped curve so it reads as held, not as a face. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16346B"/><stop offset="1" stop-color="#0A1730"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9AF0D2"/><stop offset="1" stop-color="#4FD1A5"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="540" r="150" fill="url(#mint)"/>
  <path d="M240 420 C 240 700 380 800 512 800 C 644 800 784 700 784 420" fill="none" stroke="#FFFFFF" stroke-width="72" stroke-linecap="round"/>
</svg>
