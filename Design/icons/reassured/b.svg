<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Concept B: The R. The leg of the R is a check mark. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16346B"/><stop offset="1" stop-color="#0A1730"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD1A5"/><stop offset="1" stop-color="#8EEDCB"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <path d="M330 790 V250 H510 A 140 140 0 0 1 510 530 H330" fill="none" stroke="#FFFFFF"
        stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The leg starts where the bowl meets the stem, runs down like an R's leg, then swings up into a check. -->
  <path d="M430 530 L560 710 L780 420" fill="none" stroke="url(#mint)" stroke-width="86"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
