name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Walkdown.xcodeproj \
            -target Walkdown \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Summarize errors and warnings
        if: always()
        run: |
          errors=$(grep -E "\.swift:[0-9]+:[0-9]+: error:" build.log | sed -E 's#^.*/Walkdown/Walkdown/##' | sort -u || true)
          warnings=$(grep -E "\.swift:[0-9]+:[0-9]+: warning:" build.log | sed -E 's#^.*/Walkdown/Walkdown/##' | sort -u || true)
          {
            echo "## Swift errors: $(printf '%s' "$errors" | grep -c . || true)"
            printf '%s\n' "$errors"
            echo "## Swift warnings: $(printf '%s' "$warnings" | grep -c . || true)"
            printf '%s\n' "$warnings"
          } | tee -a "$GITHUB_STEP_SUMMARY"
