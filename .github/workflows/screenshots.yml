name: Screenshots

# Runs the app with demo data on an iPhone Pro Max and a 13-inch iPad Pro simulator,
# captures each App Store screen, and pushes the images to the "screenshots" branch
# (iphone/ and ipad/ folders).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project Reassured.xcodeproj -target Reassured -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO 2>&1 | tail -3

      - name: Capture iPhone and iPad screens
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          want = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          found = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if want in d["name"]]
          print(found[-1]["udid"] if found else "")
          ' "$1"
          }
          capture_device() {
            folder="$1"; UDID="$2"
            echo "Capturing $folder on $(xcrun simctl list devices | grep "$UDID" | head -1)"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
            xcrun simctl install "$UDID" build/Debug-iphonesimulator/Reassured.app
            mkdir -p "shots/$folder"
            shot() {
              name="$1"; screen="$2"; appearance="$3"; sky="$4"
              xcrun simctl ui "$UDID" appearance "$appearance"
              xcrun simctl terminate "$UDID" com.nickmellem.reassured || true
              xcrun simctl launch "$UDID" com.nickmellem.reassured -demo -screen "$screen" -sky "$sky"
              sleep 9
              xcrun simctl io "$UDID" screenshot "shots/$folder/$name.png"
            }
            shot 01-home home light dusk
            shot 02-walk walk light dusk
            shot 03-workspace workspace light dusk
            shot 04-tasks tasks light dusk
            shot 05-locker locker light dusk
            shot 06-report report light dusk
            shot 07-guide guide light dusk
            shot 08-home-dark home dark night
            shot 09-library library light dusk
            xcrun simctl shutdown "$UDID"
          }
          IPHONE=$(pick "Pro Max")
          IPAD=$(pick "iPad Pro 13")
          [ -z "$IPAD" ] && IPAD=$(pick "iPad Pro")
          capture_device iphone "$IPHONE"
          capture_device ipad "$IPAD"
          ls -la shots/*

      - name: Push screenshots branch
        run: |
          cp -R shots /tmp/shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rf --quiet .
          git clean -fdx --quiet
          cp -R /tmp/shots/* .
          git add iphone ipad
          git commit -m "Screenshots from ${GITHUB_SHA::7}"
          git push -f origin screenshots
